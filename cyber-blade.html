<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Blade - NexusVerse</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #00f0ff;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #gameWrapper {
      position: relative;
      width: 900px;
      height: 500px;
      border: 3px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
      overflow: hidden;
      background: #000;
    }

    canvas { display: block; width: 100%; height: 100%; }

    #webcamBox {
      position: absolute;
      top: 15px; right: 15px;
      width: 140px; height: 105px;
      border: 2px solid #ff007f;
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
      background: #000;
    }

    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    #hud {
      position: absolute;
      top: 15px; left: 20px;
      z-index: 10;
      display: flex; gap: 30px;
      font-size: 1.1rem;
      text-shadow: 0 0 10px #00f0ff;
    }

    /* Tutorial Banner */
    #tutorialBanner {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(2, 6, 23, 0.9);
      border: 2px solid #00f0ff;
      padding: 12px 25px;
      border-radius: 20px;
      font-size: 1rem;
      color: #fff;
      text-align: center;
      z-index: 15;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .btn-container {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column; gap: 15px;
      z-index: 20;
    }

    .btn-main {
      padding: 15px 35px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: #020617;
      background: #00f0ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px #00f0ff;
      font-weight: 900;
      transition: transform 0.2s;
    }

    .btn-main:hover { transform: scale(1.05); }

    .btn-secondary {
      background: transparent;
      color: #00f0ff;
      border: 2px solid #00f0ff;
      box-shadow: none;
    }

    .hidden { display: none !important; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="gameWrapper">
    <div id="webcamBox">
      <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="hud">
      <div>SCORE: <span id="scoreVal" style="color: #fff;">0</span></div>
      <div>LIVES: <span id="livesVal" style="color: #ff007f;">❤❤❤</span></div>
    </div>

    <!-- Interactive Tutorial Banner -->
    <div id="tutorialBanner" class="hidden">
      <span id="tutorialText">STEP 1: Point your index finger to control the blade!</span>
    </div>

    <!-- Main Menu Buttons -->
    <div id="menuButtons" class="btn-container">
      <button class="btn-main" onclick="startMode('GAME')">START CYBER BLADE</button>
      <button class="btn-main btn-secondary" onclick="startMode('TUTORIAL')">PLAYABLE TUTORIAL</button>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const videoElement = document.getElementById('webcam');

    let camera, hands;
    let score = 0, lives = 3;
    let isGameRunning = false;
    let isTutorialMode = false;
    let tutorialStep = 1;

    let bladeTrail = [];
    let targets = [];
    let particles = [];
    let lastHandPos = null;

    function initHandTracking() {
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onHandResults);

      camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 320, height: 240
      });
    }

    function onHandResults(results) {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        lastHandPos = null;
        return;
      }

      const landmark = results.multiHandLandmarks[0][8];
      const x = (1 - landmark.x) * canvas.width;
      const y = landmark.y * canvas.height;

      bladeTrail.push({ x, y, time: Date.now() });
      checkSlices(x, y);
      lastHandPos = { x, y };

      // Tutorial Step 1 Trigger
      if (isTutorialMode && tutorialStep === 1) {
        advanceTutorialStep(2, "STEP 2: Slice the floating BLUE Target!");
        spawnTutorialTarget(false); // Stationary blue target
      }
    }

    function startMode(mode) {
      document.getElementById('menuButtons').style.display = 'none';
      isTutorialMode = (mode === 'TUTORIAL');
      
      if (isTutorialMode) {
        tutorialStep = 1;
        document.getElementById('tutorialBanner').classList.remove('hidden');
        document.getElementById('tutorialText').innerText = "STEP 1: Point your index finger at the screen to activate your blade!";
      } else {
        document.getElementById('tutorialBanner').classList.add('hidden');
      }

      if (!camera) {
        initHandTracking();
        camera.start();
      }
      
      isGameRunning = true;
      gameLoop();
    }

    function spawnTutorialTarget(isBomb) {
      targets = [{
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0, vy: 0,
        radius: isBomb ? 22 : 28,
        isBomb: isBomb,
        color: isBomb ? '#ff0055' : '#00f0ff'
      }];
    }

    function advanceTutorialStep(nextStep, text) {
      tutorialStep = nextStep;
      document.getElementById('tutorialText').innerText = text;
    }

    function spawnTarget() {
      const isBomb = Math.random() < 0.25;
      targets.push({
        x: Math.random() * (canvas.width - 200) + 100,
        y: canvas.height + 30,
        vx: (Math.random() - 0.5) * 4,
        vy: -(Math.random() * 4 + 11),
        radius: isBomb ? 22 : 28,
        isBomb: isBomb,
        color: isBomb ? '#ff0055' : '#00f0ff'
      });
    }

    function createSplatter(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          radius: Math.random() * 4 + 2,
          color, life: 1.0
        });
      }
    }

    function checkSlices(hx, hy) {
      if (!lastHandPos) return;

      targets.forEach((t, index) => {
        const dist = Math.hypot(t.x - hx, t.y - hy);
        if (dist < t.radius) {
          createSplatter(t.x, t.y, t.color);
          targets.splice(index, 1);

          if (isTutorialMode) {
            handleTutorialSlices(t);
          } else {
            if (t.isBomb) {
              lives--;
              updateLivesDisplay();
              if (lives <= 0) gameOver();
            } else {
              score += 10;
              document.getElementById('scoreVal').innerText = score;
            }
          }
        }
      });
    }

    function handleTutorialSlices(target) {
      if (tutorialStep === 2 && !target.isBomb) {
        advanceTutorialStep(3, "STEP 3: DO NOT slice RED Plasma Bombs! Slice to continue.");
        setTimeout(() => spawnTutorialTarget(true), 600);
      } else if (tutorialStep === 3 && target.isBomb) {
        advanceTutorialStep(4, "GREAT JOB! Tutorial Complete. Loading Main Game...");
        setTimeout(() => {
          isTutorialMode = false;
          document.getElementById('tutorialBanner').classList.add('hidden');
          score = 0; lives = 3;
          updateLivesDisplay();
        }, 2000);
      }
    }

    function updateLivesDisplay() {
      let str = "";
      for (let i = 0; i < lives; i++) str += "❤";
      document.getElementById('livesVal').innerText = str || "DEAD";
    }

    function update() {
      const now = Date.now();
      bladeTrail = bladeTrail.filter(pt => now - pt.time < 150);

      // Normal Mode Spawning Logic
      if (!isTutorialMode && Math.random() < 0.03) {
        spawnTarget();
      }

      // Physics
      targets.forEach((t, idx) => {
        t.x += t.vx;
        t.y += t.vy;
        if (!isTutorialMode) t.vy += 0.25;

        if (t.y > canvas.height + 50 && t.vy > 0) {
          if (!t.isBomb && !isTutorialMode) {
            lives--;
            updateLivesDisplay();
            if (lives <= 0) gameOver();
          }
          targets.splice(idx, 1);
        }
      });

      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(idx, 1);
      });
    }

    function render() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      targets.forEach(t => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
        ctx.fillStyle = t.color;
        ctx.shadowColor = t.color;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      if (bladeTrail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
        for (let i = 1; i < bladeTrail.length; i++) {
          ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
        }
        ctx.strokeStyle = "#00f0ff";
        ctx.lineWidth = 6;
        ctx.shadowColor = "#00f0ff";
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    function gameLoop() {
      if (!isGameRunning) return;
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isGameRunning = false;
      ctx.fillStyle = "rgba(2, 6, 23, 0.9)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = "30px 'Orbitron'";
      ctx.fillStyle = "#ff0055";
      ctx.textAlign = "center";
      ctx.fillText("SYSTEM CRITICAL: GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

      ctx.font = "16px 'Orbitron'";
      ctx.fillStyle = "#00f0ff";
      ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 20);

      document.getElementById('menuButtons').style.display = 'flex';
      document.getElementById('tutorialBanner').classList.add('hidden');
      targets = []; particles = []; bladeTrail = []; score = 0; lives = 3;
      document.getElementById('scoreVal').innerText = "0";
      updateLivesDisplay();
    }
  </script>
</body>
</html>
