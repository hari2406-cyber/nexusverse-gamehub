<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - NexusVerse</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .reset-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
    }
    .reset-container h2 {
      margin-bottom: 10px;
      color: #38bdf8;
      text-align: center;
    }
    .reset-container p {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #cbd5e1;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    .btn-reset {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-reset:hover {
      background: #0369a1;
    }
    .btn-reset:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
    .message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo">🎮 NexusVerse</div>
  </header>

  <main>
    <div class="reset-container">
      <h2>Forgot Password</h2>
      <p>Enter your account email below to receive a password reset link in your Gmail inbox.</p>

      <form id="resetForm">
        <div class="form-group">
          <label for="resetEmail">Account Email</label>
          <input type="email" id="resetEmail" placeholder="Enter your email address" required>
        </div>

        <button type="submit" class="btn-reset" id="sendBtn">Send Reset Link</button>
      </form>

      <div id="statusMessage" class="message"></div>

      <a href="index.html" class="back-link">← Back to Home</a>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Your NexusVerse Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCVbvw2Tj5rxKhsG7JYfvBXVAwGgaULyMY",
      authDomain: "nexusverse-ce94f.firebaseapp.com",
      projectId: "nexusverse-ce94f",
      storageBucket: "nexusverse-ce94f.firebasestorage.app",
      messagingSenderId: "481484791977",
      appId: "1:481484791977:web:b39792bbc9f8203a2349b8",
      measurementId: "G-2ZMNLGCZMP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const resetForm = document.getElementById('resetForm');
    const statusMessage = document.getElementById('statusMessage');
    const sendBtn = document.getElementById('sendBtn');

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();

      sendBtn.disabled = true;
      sendBtn.innerText = "Sending...";
      statusMessage.innerText = "";

      try {
        await sendPasswordResetEmail(auth, email);
        statusMessage.style.color = "#22c55e";
        statusMessage.innerText = "Password reset link sent! Please check your Gmail inbox.";
        sendBtn.innerText = "Sent!";
      } catch (error) {
        statusMessage.style.color = "#ef4444";
        statusMessage.innerText = error.message.replace("Firebase: ", "");
        sendBtn.disabled = false;
        sendBtn.innerText = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
