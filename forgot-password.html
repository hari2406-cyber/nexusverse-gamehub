<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - NexusVerse</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .reset-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
    }
    .reset-container h2 {
      margin-bottom: 10px;
      color: #38bdf8;
      text-align: center;
    }
    .reset-container p {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #cbd5e1;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    .btn-reset {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-reset:hover {
      background: #0369a1;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
    .message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo">🎮 NexusVerse</div>
  </header>

  <main>
    <div class="reset-container">
      <h2>Reset Password</h2>
      <p>Enter your account email and set your new password below.</p>

      <form id="resetForm" onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label for="resetEmail">Account Email</label>
          <input type="email" id="resetEmail" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat new password" required minlength="6">
        </div>

        <button type="submit" class="btn-reset">Update Password</button>
      </form>

      <div id="statusMessage" class="message"></div>

      <a href="index.html" class="back-link">← Back to Home</a>
    </div>
  </main>

  <script>
    function handleResetPassword(event) {
      event.preventDefault();
      
      const email = document.getElementById('resetEmail').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('statusMessage');

      if (newPassword !== confirmPassword) {
        messageDiv.style.color = '#ef4444';
        messageDiv.innerText = 'Passwords do not match. Please try again.';
        return;
      }

      // Store updated password in localStorage (or your auth system)
      localStorage.setItem('user_password_' + email, newPassword);

      messageDiv.style.color = '#22c55e';
      messageDiv.innerText = 'Password updated successfully! Redirecting to home...';

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 2000);
    }
  </script>
</body>
</html>
