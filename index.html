<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusVerse - Embedded Game Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">🎮 NexusVerse</div>
    <div class="nav-actions">
      <button class="notif-btn" id="notifBtn">🔔 <span id="notifCount">1</span></button>
      <a href="admin.html" class="admin-link">Admin Upload</a>
      
      <!-- Module 1: Auth Buttons -->
      <div id="authSection">
        <button id="loginBtn" onclick="openAuthModal()" class="auth-btn">Log In</button>
        <a href="signup.html" class="auth-btn signup-link-btn" style="text-decoration: none; display: inline-block;">Sign Up</a>

        <div id="userProfile" style="display: none;">
          👤 <span id="userName">User</span>
          <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Log In Pop-up Modal -->
  <div id="authModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAuthModal()">&times;</span>
      <h3>Welcome to NexusVerse</h3>
      
      <div class="form-group">
        <input type="email" id="authEmail" placeholder="Enter Email">
        <input type="password" id="authPassword" placeholder="Enter Password">
      </div>

      <button onclick="loginEmail()" class="btn-primary">Log In</button>
      <hr style="margin: 15px 0; border: 0.5px solid #334155;">
      <button onclick="loginGoogle()" class="btn-google">🌐 Continue with Google</button>
      
      <p style="margin-top: 15px; font-size: 14px; text-align: center;">
        Don't have an account? <a href="signup.html" style="color: #38bdf8; text-decoration: underline;">Register here</a>
      </p>
    </div>
  </div>

  <main class="main-container">

    <!-- Module 2: In-Page Embedded Game Player Frame -->
    <section class="player-section">
      <div id="iframeWrapper" class="iframe-wrapper">
        <iframe 
          id="gameFrame" 
          src="https://nebezb.com/floppybird/" 
          sandbox="allow-scripts allow-same-origin allow-forms"
          loading="lazy"
          allowfullscreen>
        </iframe>
      </div>

      <div class="game-bar">
        <h2 id="currentGameTitle">Flappy Bird</h2>
        <!-- Extended Module 2 Game Controls -->
        <div class="controls">
          <button onclick="toggleTheater()">🎭 Theater Mode</button>
          <button onclick="reloadGame()">🔄 Refresh Game</button>
          <button onclick="toggleFullscreen()">📺 Fullscreen</button>
        </div>
      </div>
    </section>

    <!-- Game Selection Grid -->
    <section class="catalog-section">
      <h3>🔥 Popular Games</h3>
      <div class="game-grid">
        <div class="game-card" onclick="playGame('Flappy Bird', 'https://nebezb.com/floppybird/')">
          <h4>Flappy Bird</h4>
        </div>
      </div>
    </section>

  </main>

  <!-- Link app.js file with type="module" -->
  <script type="module" src="app.js"></script>

  <!-- Auxiliary JS for UI Controls (Module 2 Engine) -->
  <script>
    function playGame(title, embedUrl) {
      const iframe = document.getElementById('gameFrame');
      iframe.src = embedUrl;
      document.getElementById('currentGameTitle').innerText = title;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleFullscreen() {
      const iframe = document.getElementById('gameFrame');
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    }

    function reloadGame() {
      const iframe = document.getElementById('gameFrame');
      iframe.src = iframe.src;
    }

    function toggleTheater() {
      const wrapper = document.getElementById('iframeWrapper');
      if (wrapper) wrapper.classList.toggle('theater-mode');
    }
  </script>
</body>
</html>

    <section class="player-section">
      <div id="iframeWrapper" class="iframe-wrapper">

          src="https://nebezb.com/floppybird/"

          allow="autoplay"
          loading="lazy"

      </div>

      <div class="game-bar">
        <h2 id="currentGameTitle">Flappy Bird</h2>
        <!-- Extended Module 2 Game Controls -->
        <div class="controls">
          <button onclick="toggleMute()" id="muteBtn">🔊 Mute</button>
          <button onclick="toggleTheater()">🎭 Theater Mode</button>
          <button onclick="reloadGame()">🔄 Refresh Game</button>
          <button onclick="toggleFullscreen()">📺 Fullscreen</button>
        </div>
      </div>
    </section>

    <!-- Game Selection Grid -->
    <section class="catalog-section">
      <h3>🔥 Popular Games</h3>
      <div class="game-grid">
        <div class="game-card" onclick="playGame('Flappy Bird', 'https://nebezb.com/floppybird/')">
          <h4>Flappy Bird</h4>
        </div>
        
        <div class="game-card" onclick="playGame('Chrome Dino', 'https://chromedino.com/')">
          <h4>Chrome Dino</h4>
        </div>

        <div class="game-card" onclick="playGame('Classic Snake', 'https://playsnake.org/')">
          <h4>Classic Snake</h4>
        </div>
      </div>
    </section>

  </main>

  <!-- Link app.js file with type="module" -->
  <script type="module" src="app.js"></script>

  <!-- Auxiliary JS for UI Controls (Module 2 Engine) -->
  <script>
    function playGame(title, embedUrl) {
      const iframe = document.getElementById('gameFrame');
      iframe.src = embedUrl;
      document.getElementById('currentGameTitle').innerText = title;
      
      if (isMuted) {
        toggleMute();
      }
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleFullscreen() {
      const iframe = document.getElementById('gameFrame');
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    }

    function reloadGame() {
      const iframe = document.getElementById('gameFrame');
      iframe.src = iframe.src;
    }

    function toggleTheater() {
      const wrapper = document.getElementById('iframeWrapper');
      if (wrapper) wrapper.classList.toggle('theater-mode');
    }

    let isMuted = false;

    function toggleMute() {
      const iframe = document.getElementById('gameFrame');
      const muteBtn = document.getElementById('muteBtn');
      isMuted = !isMuted;

      if (isMuted) {
        iframe.removeAttribute("allow");
        muteBtn.innerText = "🔇 Unmute";
      } else {
        iframe.setAttribute("allow", "autoplay");
        muteBtn.innerText = "🔊 Mute";
      }
      
      // Reload frame to apply sound preference change
      reloadGame();
    }
  </script>
</body>
</html>
